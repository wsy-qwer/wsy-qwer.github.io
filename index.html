<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <title>Hello!</title>
    <style>
        body {
            background-image: url('images/qwe.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
            font-family: 'Inter', sans-serif;
            color: white;
        }

        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .welcome-message {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .suggestion-message {
            font-size: 1.5rem;
            margin-top: 2rem;
        }

        .music-player {
            background-color: #2d2d2d;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            padding: 1rem;
            max-width: 400px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            position: absolute;
            top: 1rem;
            right: 1rem;
        }

        .music-player button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1.5rem;
        }

        .music-player #playButton {
            background-color: #007bff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .music-player .progress-bar {
            width: 200px;
            height: 4px;
            background-color: #333;
            border-radius: 2px;
            position: relative;
        }

        .music-player .progress {
            height: 100%;
            background-color: #007bff;
            border-radius: 2px;
            width: 0;
        }
    </style>
</head>

<body>
    <div class="welcome-container">
        <div class="welcome-message">Welcome to here</div>
        <div class="suggestion-message">我还没想好这个网站要做什么，你有什么好的建议吗？</div>
    </div>
    <div class="music-player">
        <audio id="myAudio" style="display: none;">
            <source src="music/nm.mp3" type="audio/mpeg">
            你的浏览器不支持 audio 元素。
        </audio>
        <button id="prevButton"><i class="fa-solid fa-step-backward"></i></button>
        <button id="playButton"><i class="fa-solid fa-play"></i></button>
        <button id="nextButton"><i class="fa-solid fa-step-forward"></i></button>
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
    </div>
    <script>
        const audio = document.getElementById('myAudio');
        const playButton = document.getElementById('playButton');
        const prevButton = document.getElementById('prevButton');
        const nextButton = document.getElementById('nextButton');
        const progress = document.getElementById('progress');
        let isPlaying = false;

        playButton.addEventListener('click', () => {
            if (!isPlaying) {
                audio.play();
                playButton.innerHTML = '<i class="fa-solid fa-pause"></i>';
            } else {
                audio.pause();
                playButton.innerHTML = '<i class="fa-solid fa-play"></i>';
            }
            isPlaying = !isPlaying;
        });

        // 暂时模拟上一曲下一曲（实际需结合音乐列表）
        prevButton.addEventListener('click', () => {
            console.log('上一曲功能（待完善音乐列表）');
        });
        nextButton.addEventListener('click', () => {
            console.log('下一曲功能（待完善音乐列表）');
        });

        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progress.style.width = `${percent}%`;
        });
    </script>
</body>

</html>
